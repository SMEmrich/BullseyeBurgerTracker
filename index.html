<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bullseye Live</title>
<meta name="description" content="Live NHL points tracking for the Bullseye Burger pool.">
<meta name="theme-color" content="#1B4B7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bullseye">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231B4B7A'/%3E%3Ccircle cx='90' cy='90' r='56' fill='none' stroke='white' stroke-width='14'/%3E%3Ccircle cx='90' cy='90' r='20' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ink:#101820; --paper:#F3F6F7; --surface:#FFFFFF; --surface-2:#F8FAFB;
  --line:#DCE3E7; --line-soft:#EAEFF1;
  --accent:#1B4B7A; --accent-ink:#ffffff; --accent-soft:#E7F0F8; --accent-soft-ink:#123453;
  --muted:#5B6B76;
  --good:#1E8E5A; --good-soft:#E4F6ED;
  --warn:#B8720A; --warn-soft:#FCF0DD;
  --danger:#C0392B; --danger-soft:#FBE7E4;
  --live:#C0392B; --live-soft:#FBE7E4;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 6px 20px -8px rgba(16,24,32,.12);
  --radius:12px; --radius-sm:8px;
  --fd:'Oswald',Impact,'Arial Narrow',sans-serif;
  --fb:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono','SF Mono',Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EAF0F3; --paper:#0E161D; --surface:#151F28; --surface-2:#101820;
  --line:#2A3742; --line-soft:#22303A;
  --accent:#69A8DE; --accent-ink:#0A1B29; --accent-soft:#1B2E3F; --accent-soft-ink:#BFDCF5;
  --muted:#93A5B0;
  --good:#3FCB88; --good-soft:#123425;
  --warn:#E7AC4C; --warn-soft:#3A2C10;
  --danger:#E37D6E; --danger-soft:#3B1C17;
  --live:#FF6B5A; --live-soft:#3B1C17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --ink:#EAF0F3; --paper:#0E161D; --surface:#151F28; --surface-2:#101820;
  --line:#2A3742; --line-soft:#22303A;
  --accent:#69A8DE; --accent-ink:#0A1B29; --accent-soft:#1B2E3F; --accent-soft-ink:#BFDCF5;
  --muted:#93A5B0;
  --good:#3FCB88; --good-soft:#123425;
  --warn:#E7AC4C; --warn-soft:#3A2C10;
  --danger:#E37D6E; --danger-soft:#3B1C17;
  --live:#FF6B5A; --live-soft:#3B1C17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:14px 56px}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
button{font-family:var(--fb)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px}
.top h1{font-size:21px;flex:1;min-width:0}
.status{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.status b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;
  vertical-align:1px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 17px}
.card+.card{margin-top:13px}
.card h2{font-size:15px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px;max-width:62ch}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:9px;margin-bottom:14px;
  border:1px solid var(--line-soft)}
.tab{flex:1;border:none;background:transparent;padding:7px 8px;border-radius:6px;font-size:12.5px;
  font-weight:600;color:var(--muted);cursor:pointer}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.banner{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius);
  background:linear-gradient(90deg,var(--warn-soft),var(--surface) 45%);padding:13px 16px;margin-bottom:14px}
.banner.bad{border-left-color:var(--danger);background:linear-gradient(90deg,var(--danger-soft),var(--surface) 45%)}
.banner.ok{border-left-color:var(--good);background:linear-gradient(90deg,var(--good-soft),var(--surface) 45%)}
.banner h3{font-family:var(--fd);font-size:16px}
.banner p{margin:5px 0 0;font-size:12.5px;color:var(--muted);max-width:64ch}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}

.tot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tot .big{font-family:var(--fd);font-size:40px;line-height:1;color:var(--accent)}
.tot .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

ul.plain{list-style:none;margin:0;padding:0}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
  padding:9px 2px;border-bottom:1px solid var(--line-soft)}
.prow:last-child{border-bottom:none}
.prow .nm{grid-column:1;grid-row:1;font-weight:600;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prow .meta{grid-column:1;grid-row:2;font-size:11.5px;color:var(--muted)}
.prow .pts,.prow>button{grid-column:2;grid-row:1/3;align-self:center}
.prow .pts{font-family:var(--fm);font-size:19px;font-weight:600;text-align:right;min-width:38px}
.prow .pts.zero{color:var(--muted);font-weight:500}
.prow .pts.scored{color:var(--good)}
.prow.livey{background:linear-gradient(90deg,var(--live-soft),transparent 60%);
  margin-inline:-6px;padding-inline:8px;border-radius:7px}

.pos{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;margin-right:5px}
.pos-C{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pos-W{background:var(--good-soft);color:var(--good)}
.pos-D{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase}
.t-live{background:var(--live-soft);color:var(--live)}
.t-final{background:var(--line-soft);color:var(--muted)}
.t-soon{background:var(--accent-soft);color:var(--accent-soft-ink)}
.t-off{background:transparent;color:var(--muted)}
.t-fix{background:var(--warn-soft);color:var(--warn)}

.gm{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-soft)}
.gm:last-child{border-bottom:none}
.gm .rk{font-family:var(--fm);font-size:12px;color:var(--muted);width:20px;flex:none}
.gm .who{flex:1;font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm.me{background:var(--accent-soft);margin-inline:-8px;padding-inline:10px;border-radius:7px}
.gm.me .who{color:var(--accent-soft-ink)}
.gm .n{font-family:var(--fm);font-weight:600;font-size:15px;flex:none}

.game{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line-soft)}
.game:last-child{border-bottom:none}
.game .sides{flex:1;font-size:13.5px;font-weight:600}
.game .sc{font-family:var(--fm);font-size:16px;font-weight:600}
.game .when{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}

textarea,input[type=text],input[type=url]{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-size:13px;color:var(--ink);font-family:var(--fb)}
textarea{font-family:var(--fm);font-size:11.5px;min-height:120px;resize:vertical}
label.fl{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.field{margin-bottom:11px}
pre.code{margin:9px 0 0;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:8px;font-family:var(--fm);font-size:11px;line-height:1.6;overflow-x:auto;white-space:pre}
.hint{font-size:11.5px;color:var(--muted);margin:7px 0 0;max-width:64ch}
.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.whogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:4px}
.whogrid .btn{width:100%}
.bar{height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.srch{position:relative}
.sug{list-style:none;margin:5px 0 0;padding:0;max-height:190px;overflow-y:auto;border:1px solid var(--line);
  border-radius:8px;background:var(--surface)}
.sug li{padding:7px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.sug li:last-child{border-bottom:none}
.sug li:hover{background:var(--surface-2)}
.sug .t{color:var(--muted);font-size:11px;margin-left:6px}
.chipx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 3px;line-height:1}
.chipx:hover{color:var(--danger)}
footer{margin-top:24px;text-align:center;color:var(--muted);font-size:11px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function norm(s){
  s = String(s==null?'':s).normalize('NFKD').replace(/[̀-ͯ]/g,'');
  return s.toLowerCase().replace(/[^a-z]/g,'');
}
function surnameOf(full){ var t=String(full||'').trim().split(/\s+/); return t.slice(1).join(' '); }
function firstOf(full){ return String(full||'').trim().split(/\s+/)[0]||''; }
function teamCode(t){ t=String(t||'').toUpperCase(); return TEAM_ALIAS[t]||t; }
function posBucket(p){ p=String(p||'').toUpperCase(); if(p==='D')return 'D'; if(p==='C')return 'C'; return 'W'; }

function url(u){
  if(!S.proxy) return u;
  var p = S.proxy.replace(/\/+$/,'');
  return p + (p.indexOf('?')>-1?'&':'?') + 'u=' + encodeURIComponent(u);
}
/* Retries transient refusals. A burst of requests from one address can get
   throttled (429) or dropped, and a single miss used to sink the whole load. */
function getJSON(u, tries){
  tries = tries || 3;
  function attempt(left){
    return fetch(url(u),{cache:'no-store'}).then(function(r){
      if(r.status===429 || r.status===408 || r.status>=500) throw new Error('HTTP '+r.status);
      if(!r.ok) throw new Error('HTTP '+r.status+' on '+u);
      return r.json();
    }).catch(function(e){
      if(left<=1) throw e;
      var wait = 500 * Math.pow(3, tries-left);   // 500ms, then 1.5s
      return new Promise(function(res){ setTimeout(res, wait); }).then(function(){ return attempt(left-1); });
    });
  }
  return attempt(tries);
}
function throttle(items, n, fn){
  var i=0, out=[], active=0;
  return new Promise(function(res,rej){
    function next(){
      if(i>=items.length && active===0) return res(out);
      while(active<n && i<items.length){
        (function(k){
          active++; i++;
          Promise.resolve(fn(items[k],k)).then(function(v){ out[k]=v; },function(){ out[k]=null; })
            .then(function(){ active--; next(); });
        })(i);
      }
    }
    if(!items.length) return res([]);
    next();
  });
}

/* ---------- name -> playerId index ----------
   Built one team at a time and merged, never all-or-nothing. Fetching all 32
   rosters at once is a burst the API can refuse; instead only the teams playing
   today are fetched up front, plus a few spares each refresh, so the index fills
   in over a couple of nights. A team we don't have yet costs nothing: its players
   simply read as not-yet-matched, and they weren't playing anyway. */
function emptyIndex(){ return {byFull:{}, bySur:{}, all:[], teams:{}, ids:{}, at:Date.now()}; }

/* One entry per playerId, always. A player appearing twice makes every match
   involving him ambiguous, and an ambiguous match is refused by design — so a
   duplicate doesn't cause a wrong answer, it causes NO answer. */
function pushRec(idx, rec){
  if(idx.ids[rec.id]) return false;
  idx.ids[rec.id]=1;
  idx.all.push(rec);
  (idx.byFull[norm(rec.full)] = idx.byFull[norm(rec.full)]||[]).push(rec);
  (idx.bySur[norm(rec.last)]  = idx.bySur[norm(rec.last)]||[]).push(rec);
  return true;
}
function addTeamToIndex(idx, team, j){
  var n=0;
  ['forwards','defensemen','goalies'].forEach(function(k){
    (j[k]||[]).forEach(function(p){
      var fn=(p.firstName&&p.firstName.default)||'', ln=(p.lastName&&p.lastName.default)||'';
      if(!ln || p.id==null) return;
      if(pushRec(idx, {id:p.id, first:fn, last:ln, full:(fn+' '+ln).trim(),
                       team:team, pos:p.positionCode})) n++;
    });
  });
  idx.teams[team]=1;
  return n;
}
function reindex(all, at, teams){
  var idx=emptyIndex(); idx.at=at||Date.now(); idx.teams=teams||{};
  all.forEach(function(r){ if(r && r.id!=null) pushRec(idx, r); });
  return idx;
}
function loadIndexFromCache(){
  var c = store.get('index',null);
  if(!c || !c.all || !c.all.length) return false;
  // A cache written by an older build has a different shape; merging into it is
  // what produced the duplicates. Throw it away rather than try to repair it.
  if(c.v !== IDX_VER){ store.del('index'); return false; }
  if(Date.now()-c.at > 7*24*3600*1000) return false;   // weekly rebuild; trades go stale
  S.index = reindex(c.all, c.at, c.teams||{});
  return true;
}
function saveIndex(){
  try{ store.set('index',{v:IDX_VER, at:S.index.at, all:S.index.all, teams:S.index.teams}); }catch(e){}
}
function indexTeamCount(){ return S.index ? Object.keys(S.index.teams).length : 0; }

/* Teams still missing from the index, least-recently-needed first. */
function topUpTeams(n){
  if(!S.index) return TEAMS.slice(0,n);
  var missing = TEAMS.filter(function(t){ return !S.index.teams[t]; });
  return missing.slice(0,n);
}
function ensureIndex(wanted){
  if(!S.index) S.index = emptyIndex();
  var todo=[], seen={};
  (wanted||[]).forEach(function(t){
    t=teamCode(t);
    if(t && TEAMS.indexOf(t)>-1 && !S.index.teams[t] && !seen[t]){ seen[t]=1; todo.push(t); }
  });
  if(!todo.length) return Promise.resolve();
  var ok=0, lastErr=null;
  S.prog={done:0,total:todo.length};
  render();
  return throttle(todo, 2, function(t){           // gentle: two at a time
    return getJSON(API+'/v1/roster/'+t+'/current')
      .then(function(j){ addTeamToIndex(S.index, t, j); ok++; })
      .catch(function(e){ lastErr=e; })
      .then(function(){ S.prog.done++; render(); });
  }).then(function(){
    S.prog=null;
    if(ok){ S.netfail=false; saveIndex(); return; }
    // Nothing at all came back, and we have no earlier index to fall back on.
    if(!S.index.all.length){
      S.netfail=true;
      throw new Error(lastErr ? String(lastErr.message||lastErr) : 'No rosters came back.');
    }
  });
}

/* Two records for the same player are the same player, not a genuine ambiguity. */
function uniq(list){
  var seen={}, out=[];
  (list||[]).forEach(function(r){ if(r && !seen[r.id]){ seen[r.id]=1; out.push(r); } });
  return out;
}

/* Resolution, safest first. Never matches on a first initial. */
function resolveOne(p){
  var idx=S.index; if(!idx) return null;
  var key=norm(p.name);
  var ov=S.overrides[key];
  if(ov){ var hit=idx.all.filter(function(r){ return r.id===ov; })[0]; if(hit) return {rec:hit,how:'manual'}; }

  var ex = uniq(idx.byFull[key]);
  if(ex.length===1) return {rec:ex[0],how:'exact'};
  if(ex.length>1){
    var t=teamCode(p.team), m=ex.filter(function(r){ return r.team===t; });
    if(m.length===1) return {rec:m[0],how:'exact'};
  }
  // Nickname case (Mitch vs Mitchell): same surname, same team, one first name
  // a prefix of the other. Flagged for confirmation, never silent.
  var sur=uniq(idx.bySur[norm(surnameOf(p.name))]);
  var tc=teamCode(p.team);
  var same=sur.filter(function(r){
    if(r.team!==tc) return false;
    var a=norm(firstOf(p.name)), b=norm(r.first);
    return a&&b&&(a.indexOf(b)===0||b.indexOf(a)===0);
  });
  if(same.length===1) return {rec:same[0],how:'fuzzy'};
  return null;
}
function resolveAll(){
  S.resolved={}; S.unresolved=[];
  var r=S.roster; if(!r||!S.index) return;
  Object.keys(r).forEach(function(gm){
    r[gm].forEach(function(p){
      var res=resolveOne(p);
      if(res) S.resolved[norm(p.name)]={id:res.rec.id, rec:res.rec, how:res.how, pool:p, gm:gm};
      else S.unresolved.push({pool:p, gm:gm});
    });
  });
}

// ---------- live data ----------
function loadGames(){
  return getJSON(API+'/v1/score/now').then(function(j){
    S.games=(j.games||[]).map(function(g){
      return {id:g.id, away:(g.awayTeam||{}).abbrev, home:(g.homeTeam||{}).abbrev,
              as:(g.awayTeam||{}).score, hs:(g.homeTeam||{}).score,
              state:g.gameState, start:g.startTimeUTC,
              per:(g.periodDescriptor||{}).number,
              clock:(g.clock||{}).timeRemaining, inter:(g.clock||{}).inIntermission};
    });
  });
}
function teamsPlayingToday(){
  var out=[];
  S.games.forEach(function(g){ if(g.away) out.push(g.away); if(g.home) out.push(g.home); });
  return out;
}
var FINAL_TTL = 5*60*1000;   // finished games only need re-reading for stat corrections

function loadBoxes(){
  var played=S.games.filter(function(g){ return ['LIVE','CRIT','FINAL','OFF'].indexOf(g.state)>-1; });
  var now=Date.now();
  // Re-read a live game every cycle; a finished one at most every five minutes.
  // With eleven GMs sharing one proxy, refetching finals every 30s is most of the traffic.
  var need=played.filter(function(g){
    var c=S.boxes[g.id];
    if(!c || !c.box) return true;
    if(g.state==='LIVE' || g.state==='CRIT') return true;
    return (now - c.at) > FINAL_TTL;
  });
  return throttle(need, 3, function(g){
    return getJSON(API+'/v1/gamecenter/'+g.id+'/boxscore')
      .then(function(j){ S.boxes[g.id]={at:Date.now(), box:j}; })
      .catch(function(){});
  }).then(function(){
    var today={};
    played.forEach(function(g){
      var c=S.boxes[g.id]; var b=c&&c.box;
      if(!b||!b.playerByGameStats) return;
      ['awayTeam','homeTeam'].forEach(function(side){
        var team = (b[side==='awayTeam'?'awayTeam':'homeTeam']||{}).abbrev;
        ['forwards','defense'].forEach(function(grp){
          ((b.playerByGameStats[side]||{})[grp]||[]).forEach(function(p){
            today[p.playerId] = {g:p.goals||0, a:p.assists||0, p:p.points||0,
                                 toi:p.toi||'', team:team, gameId:b.id, state:b.gameState};
          });
        });
      });
    });
    S.today=today;
    S.lastAt=Date.now();
  });
}
var SEASON_TTL = 5*60*1000;
function loadSeason(){
  // Regular-season totals in one call — a big payload, and it barely moves
  // between polls, so it is fetched at most every five minutes.
  if(S.seasonAt && (Date.now()-S.seasonAt) < SEASON_TTL) return Promise.resolve();
  var season = seasonId();
  var u = STATS+'/stats/rest/en/skater/summary?limit=2500&start=0&sort=points&cayenneExp='+
          encodeURIComponent('seasonId='+season+' and gameTypeId=2');
  return getJSON(u).then(function(j){
    var m={};
    (j.data||[]).forEach(function(r){
      if(r.playerId!=null) m[r.playerId]={p:r.points||0, g:r.goals||0, a:r.assists||0, gp:r.gamesPlayed||0};
    });
    S.season=m; S.seasonAt=Date.now();
  }).catch(function(){ if(!S.seasonAt) S.season={}; });
}
function seasonId(){
  var d=new Date(), y=d.getFullYear();
  // NHL season rolls over in September.
  return (d.getMonth()>=8) ? (''+y+(y+1)) : (''+(y-1)+y);
}

// ---------- totals ----------
function ptsFor(name){
  var r=S.resolved[norm(name)]; if(!r) return {today:null,season:null,rec:null,how:null};
  var t=S.today[r.id]||null, s=S.season[r.id]||null;
  return {today:t, season:s, rec:r.rec, how:r.how, id:r.id};
}
function gmTotals(gm){
  var list=(S.roster&&S.roster[gm])||[], tod=0, sea=0;
  list.forEach(function(p){
    var x=ptsFor(p.name);
    if(x.today) tod+=x.today.p;
    if(x.season) sea+=x.season.p;
  });
  return {today:tod, season:sea, n:list.length};
}
function gameFor(team){
  team=teamCode(team);
  for(var i=0;i<S.games.length;i++){
    var g=S.games[i];
    if(g.away===team||g.home===team) return g;
  }
  return null;
}
function gameTag(g){
  if(!g) return '<span class="tag t-off">Not playing</span>';
  if(g.state==='LIVE'||g.state==='CRIT'){
    var w = g.inter ? 'Intermission' : ('P'+(g.per||'?')+' '+(g.clock||''));
    return '<span class="tag t-live">'+esc(w)+'</span>';
  }
  if(g.state==='FINAL'||g.state==='OFF') return '<span class="tag t-final">Final</span>';
  var t=''; try{ t=new Date(g.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }catch(e){}
  return '<span class="tag t-soon">'+esc(t||'Later')+'</span>';
}
function anyLive(){ return S.games.some(function(g){ return g.state==='LIVE'||g.state==='CRIT'; }); }

// ---------- tally parsing ----------
/* Draft-board "Copy all" format:
   Tony / Kucherov / Nikita / TBL / W / 5440 / 5440   */
function parseTally(txt){
  var out={}, n=0, bad=0;
  String(txt||'').split(/\r?\n/).forEach(function(line){
    line=line.trim();
    if(!line || /^round\s+\d+$/i.test(line)) return;
    var f=line.split('/').map(function(x){ return x.trim(); });
    if(f.length<5){ bad++; return; }
    var gm=f[0], last=f[1], first=f[2], team=f[3], pos=f[4];
    if(!gm||!last){ bad++; return; }
    var name=(first?first+' ':'')+last;
    (out[gm]=out[gm]||[]).push({name:name, team:teamCode(team), pos:posBucket(pos)});
    n++;
  });
  return {roster:out, count:n, bad:bad};
}

// ---------- boot ----------
function refresh(){
  if(S.busy) return Promise.resolve();
  S.busy=true; S.err=null; render();
  if(!S.index) loadIndexFromCache();
  // Games first: that tells us which rosters are actually worth fetching.
  return loadGames()
    .then(function(){ return ensureIndex(teamsPlayingToday().concat(topUpTeams(4))); })
    .then(function(){ return loadBoxes(); })
    .then(function(){ return loadSeason(); })
    .then(function(){ resolveAll(); S.busy=false; render(); })
    .catch(function(e){ S.err=e&&e.message||String(e); S.busy=false; render(); });
}

var timer=null;
function schedule(){
  if(timer) clearTimeout(timer);
  var ms = anyLive() ? 30000 : 300000;   // 30s during games, 5 min otherwise
  timer=setTimeout(function(){ refresh().then(schedule); }, ms);
}

// ============================ VIEWS ============================
function whoCard(gms){
  return '<div class="card"><h2>Which team is yours?</h2>'+
    '<p class="sub">Tap once and this device remembers. It decides whose roster shows up here '+
    'and highlights your row in the pool standings.</p>'+
    '<div class="whogrid">'+gms.map(function(g){
      return '<button class="btn" data-me="'+esc(g)+'" type="button">'+esc(g)+'</button>';
    }).join('')+'</div></div>';
}

function view_mine(){
  if(!S.roster){ return setupPrompt(); }
  var gms=Object.keys(S.roster);
  // Never quietly show someone else's team — ask instead.
  if(!(S.me && S.roster[S.me])) return whoCard(gms);
  var me=S.me;
  var list=S.roster[me]||[];
  var tot=gmTotals(me);
  var rows=list.map(function(p){
    var x=ptsFor(p.name), g=gameFor(x.rec?x.rec.team:p.team);
    var live=g&&(g.state==='LIVE'||g.state==='CRIT');
    var pts = x.today ? x.today.p : 0;
    var det = x.today ? (x.today.g+'G '+x.today.a+'A') : (g?'&mdash;':'');
    var seas = x.season ? (' &middot; '+x.season.p+' this season') : '';
    var fix  = (!x.rec) ? ' <span class="tag t-fix">Needs matching</span>' :
               (x.how==='fuzzy' ? ' <span class="tag t-fix">Confirm</span>' : '');
    return '<li class="prow'+(live?' livey':'')+'">'+
      '<div class="nm"><span class="pos pos-'+esc(p.pos)+'">'+esc(p.pos)+'</span>'+esc(p.name)+fix+'</div>'+
      '<div class="pts '+(pts>0?'scored':'zero')+'">'+pts+'</div>'+
      '<div class="meta">'+esc(x.rec?x.rec.team:p.team)+' &middot; '+gameTag(g)+
        (det?' &middot; '+det:'')+seas+'</div></li>';
  }).join('');
  var sel = gms.length>1 ? '<select id="whoami" style="margin-left:auto">'+gms.map(function(g){
      return '<option value="'+esc(g)+'"'+(g===me?' selected':'')+'>'+esc(g)+'</option>'; }).join('')+'</select>' : '';
  return '<div class="card">'+
    '<div style="display:flex;align-items:center;gap:8px"><h2>'+esc(me)+'</h2>'+sel+'</div>'+
    '<div class="tot"><span class="big mono">'+tot.today+'</span><span class="cap">points today</span>'+
      (tot.season?'<span class="cap" style="margin-left:auto">'+tot.season+' this season</span>':'')+'</div>'+
    (list.length?'<ul class="plain">'+rows+'</ul>':'<div class="empty">No players yet.</div>')+
  '</div>' + (S.unresolved.length?unresolvedCard():'');
}

function view_pool(){
  if(!S.roster) return setupPrompt();
  var gms=Object.keys(S.roster).map(function(g){ var t=gmTotals(g); return {gm:g,t:t}; });
  gms.sort(function(a,b){ return (b.t.today-a.t.today)||(b.t.season-a.t.season)||a.gm.localeCompare(b.gm); });
  var rows=gms.map(function(o,i){
    return '<div class="gm'+(o.gm===S.me?' me':'')+'">'+
      '<span class="rk">'+(i+1)+'</span>'+
      '<span class="who">'+esc(o.gm)+'</span>'+
      (o.t.season?'<span class="rk" style="width:auto">'+o.t.season+' szn</span>':'')+
      '<span class="n">'+o.t.today+'</span></div>';
  }).join('');
  return '<div class="card"><h2>Tonight</h2>'+
    '<p class="sub">Every GM’s points from today’s games. Ranked live.</p>'+rows+'</div>';
}

function view_games(){
  if(!S.games.length) return '<div class="card"><h2>Games</h2><div class="empty">No games scheduled today.</div></div>';
  var rows=S.games.map(function(g){
    var when='';
    if(g.state==='LIVE'||g.state==='CRIT') when=g.inter?'Intermission':('Period '+(g.per||'?')+' &middot; '+esc(g.clock||''));
    else if(g.state==='FINAL'||g.state==='OFF') when='Final';
    else { try{ when=new Date(g.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }catch(e){ when='Scheduled'; } }
    var pending=(g.state==='FUT'||g.state==='PRE');
    var live=(g.state==='LIVE'||g.state==='CRIT');
    var tag = live ? '<span class="tag t-live">Live</span>'
            : pending ? '<span class="tag t-soon">Scheduled</span>' : '';
    return '<div class="game"><div class="sides">'+esc(g.away)+' at '+esc(g.home)+
      '<div class="when">'+when+'</div></div>'+
      '<div class="sc">'+(pending?'':esc(g.as+' – '+g.hs))+'</div>'+tag+'</div>';
  }).join('');
  return '<div class="card"><h2>Today’s games</h2>'+rows+'</div>';
}

function setupPrompt(){
  return '<div class="card"><h2>No roster yet</h2>'+
    '<p class="sub">Paste the draft board’s tally once the draft is done, or add a few players by hand '+
    'to watch tonight. Either way it’s saved in this browser.</p>'+
    '<button class="btn btn-primary" id="gosetup" type="button">Open setup</button></div>';
}

function unresolvedCard(){
  var rows=S.unresolved.map(function(u){
    return '<li class="prow"><div class="nm">'+esc(u.pool.name)+'</div>'+
      '<button class="btn btn-sm" data-fix="'+esc(u.pool.name)+'" type="button">Match</button>'+
      '<div class="meta">'+esc(u.gm)+' &middot; listed on '+esc(u.pool.team||'?')+
      ' &middot; no confident match in the NHL rosters</div></li>';
  }).join('');
  return '<div class="card"><h2>Needs matching</h2>'+
    '<p class="sub">These names didn’t resolve to an NHL player with enough confidence to be safe. '+
    'Usually a trade, a nickname, or two players sharing a surname. Pick the right one and it sticks.</p>'+
    '<ul class="plain">'+rows+'</ul>'+(S.pick.open?pickerHtml():'')+'</div>';
}
function pickerHtml(){
  var q=norm(S.pick.q), hits=[];
  if(q.length>=2 && S.index){
    hits=S.index.all.filter(function(r){ return norm(r.full).indexOf(q)>-1; }).slice(0,25);
  }
  return '<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">'+
    '<label class="fl">Find the NHL player for &ldquo;'+esc(S.pick.for)+'&rdquo;</label>'+
    '<input type="text" id="pickq" value="'+esc(S.pick.q)+'" placeholder="Start typing a name…" autocomplete="off">'+
    (hits.length?'<ul class="sug">'+hits.map(function(r){
      return '<li data-pid="'+r.id+'">'+esc(r.full)+'<span class="t">'+esc(r.team)+' &middot; '+esc(r.pos)+' &middot; #'+r.id+'</span></li>';
    }).join('')+'</ul>':(q.length>=2?'<p class="hint">Nothing matching.</p>':''))+
    '<button class="btn btn-sm" id="pickcancel" type="button" style="margin-top:9px">Cancel</button></div>';
}

       : 'None loaded.')+'</p>'+

         return '<option value="'+esc(g)+'"'+(g===S.me?' selected':'')+'>'+esc(g)+'</option>'; })).join('')+'</select></div>';
  }

  h+='<div class="card"><h2>Connection</h2>'+

     '<button class="btn btn-primary" id="saveproxy" type="button">Save and retry</button> '+
     '<button class="btn" id="testconn" type="button">Test connection</button>'+
     '<p class="hint" id="testmsg">'+(S.test?esc(S.test):
        'Pre-filled with the pool’s proxy so it works on any phone without setup. '+
        'Clear the field and save to call the NHL directly instead.')+'</p>'+
     '<p class="hint">Paste this into a Cloudflare Worker, deploy it, and put its address in the field above. '+

  h+='<div class="card"><h2>Player index</h2>'+
     '<p class="sub">'+(S.index&&S.index.all.length
        ? (S.index.all.length+' NHL players from '+indexTeamCount()+' of 32 teams, first built '+
           new Date(S.index.at).toLocaleString()+'. The rest fill in as those teams play. '+
           'Rebuild after a trade.')
        : 'Not built yet — it fills in the first time you load it during a game day.')+'</p>'+
     '<button class="btn" id="rebuild" type="button">Rebuild index</button></div>';
  return h;
}

function addSuggestions(){
  var q=norm(S.addq); if(q.length<2) return '';
  var hits=POOL_LIST.filter(function(p){ return norm(p.n).indexOf(q)>-1; }).slice(0,20);
  if(!hits.length) return '<p class="hint">Nobody by that name on the list.</p>';
  return '<ul class="sug">'+hits.map(function(p){
    return '<li data-add="'+esc(p.n)+'" data-team="'+esc(p.t)+'" data-pos="'+esc(p.p)+'">'+
      esc(p.n)+'<span class="t">'+esc(p.t)+' &middot; '+esc(p.p)+'</span></li>';
  }).join('')+'</ul>';
}
function watchlistHtml(){
  var w=(S.roster&&S.roster['My watchlist'])||[];
  if(!w.length) return '<p class="hint" style="margin-top:10px">Nobody added yet.</p>';
  return '<ul class="plain" style="margin-top:10px">'+w.map(function(p){
    return '<li class="prow"><div class="nm">'+esc(p.name)+'</div>'+
      '<button class="chipx" data-rm="'+esc(p.name)+'" type="button" aria-label="Remove">&times;</button>'+
      '<div class="meta">'+esc(p.team)+' &middot; '+esc(p.pos)+'</div></li>';
  }).join('')+'</ul>';
}

var WORKER_SRC =
"export default {\n"+
"  async fetch(request) {\n"+
"    const target = new URL(request.url).searchParams.get('u');\n"+
"    if (!target) return new Response('missing u', { status: 400 });\n"+
"    const ok = ['https://api-web.nhle.com/', 'https://api.nhle.com/'];\n"+
"    if (!ok.some(p => target.startsWith(p)))\n"+
"      return new Response('blocked', { status: 403 });\n"+
"    const upstream = await fetch(target, { headers: { accept: 'application/json' } });\n"+
"    const out = new Response(upstream.body, upstream);\n"+
"    out.headers.set('Access-Control-Allow-Origin', '*');\n"+
"    out.headers.set('Cache-Control', 'no-store');\n"+
"    return out;\n"+
"  }\n"+
"};";

// ---------- banners ----------
function banners(){
  var h='';
  // Opening the file straight off disk looks identical to a CORS failure but isn't one:
  // browsers refuse every cross-origin call from a file:// page no matter what headers come back.
  if(location.protocol==='file:'){
    h+='<div class="banner bad"><h3>This page is running off your hard drive</h3>'+
       '<p>The address bar starts with <b>file://</b>. Browsers block every outside call from a page '+
       'opened that way — no header, proxy or setting changes it, so nothing here can load. '+
       'Put the file on GitHub Pages and open it at its https address, or, to test right now, run '+
       '<b>python3 -m http.server</b> in the folder and open <b>http://localhost:8000</b>.</p></div>';
  }
  if(S.err){
    var blocked = S.netfail || /Failed to fetch|NetworkError|load failed|CORS/i.test(S.err);
    h+='<div class="banner bad"><h3>'+(blocked?'Your browser is blocking the NHL':'Something went wrong')+'</h3>'+
       '<p>'+(blocked
         ? 'Every call was refused before it returned anything. That is almost always the browser’s '+
           'cross-origin rule: the NHL’s servers don’t say this address is allowed to read their '+
           'responses, so the browser throws the answer away. It is not something the page can fix from '+
           'here — the calls have to come from a server instead. Setup has the proxy field and the code for one.'
         : esc(S.err))+'</p>'+
       '<p class="hint mono" style="margin-top:6px">'+esc(S.err)+(S.proxy?' · via proxy '+esc(S.proxy):' · calling the NHL directly')+'</p>'+
       '<div class="row"><button class="btn btn-sm btn-primary" id="retry" type="button">Try again</button>'+
       '<button class="btn btn-sm" id="gosetup2" type="button">Set up a proxy</button></div></div>';
  }
  if(S.prog){
    var pc=Math.round(100*S.prog.done/S.prog.total);
    h+='<div class="banner"><h3>Matching players to NHL rosters</h3>'+
       '<p>Reading '+S.prog.total+' roster'+(S.prog.total===1?'':'s')+' so tonight’s skaters get '+
       'pinned to real player IDs. Cached once it’s done.</p>'+
       '<div class="bar"><i style="width:'+pc+'%"></i></div></div>';
  }
  return h;
}

// ---------- render ----------
function render(){
  document.getElementById('banners').innerHTML=banners();
  var st=document.getElementById('status');
  var bits=[];
  if(S.busy) bits.push('Updating…');
  else if(S.lastAt) bits.push('Updated <b>'+new Date(S.lastAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</b>');
  if(anyLive()) bits.unshift('<span class="dot"></span>Live');
  if(S.games.length) bits.push(S.games.length+' game'+(S.games.length===1?'':'s')+' today');
  bits.push(S.proxy?'via proxy':'direct');
  bits.push(BUILD);
  st.innerHTML=bits.join(' &middot; ')||'Ready';

  var v=document.getElementById('view');
  v.innerHTML = S.tab==='mine'?view_mine() : S.tab==='pool'?view_pool() :
                S.tab==='games'?view_games() : view_setup();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.classList.toggle('active', b.dataset.tab===S.tab);
  });
  document.getElementById('refresh').disabled=S.busy;
}

// ---------- events ----------
document.addEventListener('click',function(e){
  var t=e.target, b=t.closest?t.closest('button'):null;
  if(t.closest&&t.closest('.tab')){ S.tab=t.closest('.tab').dataset.tab; render(); return; }
  if(!b&&!t.closest) return;

  if(b&&b.id==='refresh'){ refresh().then(schedule); return; }
  if(b&&(b.id==='retry')){ refresh().then(schedule); return; }
  if(b&&(b.id==='gosetup'||b.id==='gosetup2')){ S.tab='setup'; render(); return; }
  if(b&&b.id==='rebuild'){ store.del('index'); S.index=null; S.test=''; refresh().then(schedule); return; }

  if(b&&b.id==='loadtally'){
    var r=parseTally(document.getElementById('tally').value);
    var msg=document.getElementById('tallymsg');
    if(!r.count){ msg.textContent='Nothing readable in there — expecting lines like "Tony / Kucherov / Nikita / TBL / W / 5440 / 5440".'; return; }
    S.roster=r.roster; store.set('roster',S.roster);
    resolveAll(); S.tab='mine'; render();
    return;
  }
  if(b&&b.id==='clearroster'){ S.roster=null; store.del('roster'); resolveAll(); render(); return; }
  if(b&&b.id==='restore'){
    store.del('roster');
    S.roster = DEFAULT_ROSTER ? JSON.parse(JSON.stringify(DEFAULT_ROSTER)) : null;
    resolveAll(); S.tab='mine'; render(); return;
  }
  if(b&&b.id==='testconn'){
    S.test='Testing…'; render();
    var t0=Date.now();
    getJSON(API+'/v1/roster/TOR/current').then(function(j){
      var n=(j.forwards||[]).length+(j.defensemen||[]).length+(j.goalies||[]).length;
      S.test='Worked — '+n+' Leafs came back in '+(Date.now()-t0)+' ms. '+
             (S.proxy?'Your proxy is doing its job.':'Direct calls are fine; no proxy needed.');
      render();
    }).catch(function(e){
      S.test='Failed: '+(e&&e.message||e)+'. '+(S.proxy
        ? 'Check the address is exactly what Cloudflare shows, ending in .workers.dev'
        : 'This is the cross-origin block. A proxy will fix it.');
      render();
    });
    return;
  }
  if(b&&b.id==='copyworker'){
    var ta=document.createElement('textarea'); ta.value=WORKER_SRC;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(x){}
    document.body.removeChild(ta);
    b.textContent = ok ? 'Copied' : 'Select it manually';
    setTimeout(function(){ b.textContent='Copy this code'; }, 2200);
    return;
  }
  if(b&&b.id==='saveproxy'){
    S.proxy=(document.getElementById('proxy').value||'').trim();
    store.set('proxy',S.proxy);
    store.del('index'); S.index=null;
    refresh().then(schedule); return;
  }
  if(b&&b.dataset&&b.dataset.fix!=null){ S.pick={open:true,for:b.dataset.fix,q:b.dataset.fix}; render(); return; }
  if(b&&b.dataset&&b.dataset.me!=null){ S.me=b.dataset.me; store.set('me',S.me); render(); return; }
  if(b&&b.id==='pickcancel'){ S.pick={open:false,for:null,q:''}; render(); return; }
  if(b&&b.dataset&&b.dataset.rm!=null){
    var w=S.roster['My watchlist']||[];
    S.roster['My watchlist']=w.filter(function(p){ return p.name!==b.dataset.rm; });
    if(!S.roster['My watchlist'].length && Object.keys(S.roster).length===1) S.roster=null;
    store.set('roster',S.roster); resolveAll(); render(); return;
  }

  var li=t.closest?t.closest('li[data-pid]'):null;
  if(li){
    S.overrides[norm(S.pick.for)]=parseInt(li.dataset.pid,10);
    store.set('overrides',S.overrides);
    S.pick={open:false,for:null,q:''};
    resolveAll(); render(); return;
  }
  var la=t.closest?t.closest('li[data-add]'):null;
  if(la){
    S.roster=S.roster||{};
    var list=S.roster['My watchlist']=S.roster['My watchlist']||[];
    if(!list.some(function(p){ return p.name===la.dataset.add; }))
      list.push({name:la.dataset.add, team:teamCode(la.dataset.team), pos:posBucket(la.dataset.pos)});
    S.addq=''; store.set('roster',S.roster); resolveAll(); render(); return;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='addq'){ S.addq=e.target.value; var c=e.target.selectionStart; render();
    var n=document.getElementById('addq'); if(n){ n.focus(); try{n.setSelectionRange(c,c);}catch(x){} } }
  if(e.target.id==='pickq'){ S.pick.q=e.target.value; var c2=e.target.selectionStart; render();
    var n2=document.getElementById('pickq'); if(n2){ n2.focus(); try{n2.setSelectionRange(c2,c2);}catch(x){} } }
});
document.addEventListener('change',function(e){
  if(e.target.id==='whoami'){ S.me=e.target.value; store.set('me',S.me); render(); }
  if(e.target.id==='setme'){ S.me=e.target.value; store.set('me',S.me); render(); }
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden && Date.now()-S.lastAt>30000) refresh().then(schedule);
});

// A link like ...index.html?gm=George opens straight to that GM's team.
try{
  var qgm=(location.search.match(/[?&]gm=([^&]*)/)||[])[1];
  if(qgm && S.roster){
    var want=norm(decodeURIComponent(qgm.replace(/\+/g,' ')));
    var found=Object.keys(S.roster).filter(function(g){ return norm(g)===want; })[0];
    if(found){ S.me=found; store.set('me',found); }
  }
}catch(e){}

render();
refresh().then(schedule);
})();
</script>
